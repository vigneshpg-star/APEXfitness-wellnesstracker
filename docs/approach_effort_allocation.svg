    <text x="30" y="68" class="stat-val" fill="#FF6A13">120 Hours</text>
    <text x="30" y="92" class="stat-sub">4 Milestone Phases</text>
    <line x1="250" y1="20" x2="250" y2="95" stroke="#26262E" stroke-width="1.5" />

    <!-- Col 2 -->
    <text x="280" y="35" class="section-label">CORE DATA MODEL</text>
    <text x="280" y="68" class="stat-val">7 Tables</text>
