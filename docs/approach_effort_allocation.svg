    <text x="26" y="110" class="meta-bold" fill="#FF6A13">25 Hours</text>
    <text x="96" y="110" class="meta-light">(20.8% Effort)</text>
    <text x="26" y="128" class="meta-light">Schedule: Week 1</text>
    <text x="215" y="128" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#FF6A13">Conceptual &amp; Logical</text>

    <text x="18" y="165" class="section-label">KEY ACTIVITIES &amp; METHODOLOGY</text>
    <text x="18" y="190" fill="#FF6A13" font-weight="bold">•</text>
    <text x="32" y="190" class="body-txt">Decomposed 4 tracking domains into 3NF entities.</text>
    <text x="18" y="218" fill="#FF6A13" font-weight="bold">•</text>
    <text x="32" y="218" class="body-txt">Eliminated repeating groups &amp; dependencies.</text>
    <text x="18" y="246" fill="#FF6A13" font-weight="bold">•</text>
    <text x="32" y="246" class="body-txt">Engineered Crow's Foot ERD (strict cardinality).</text>
    <text x="18" y="274" fill="#FF6A13" font-weight="bold">•</text>
    <text x="32" y="274" class="body-txt">Authored full Data Dictionary for all columns.</text>
    <text x="18" y="302" fill="#FF6A13" font-weight="bold">•</text>
    <text x="32" y="302" class="body-txt">Defined domain CHECK and UNIQUE constraints.</text>
    <text x="18" y="330" fill="#FF6A13" font-weight="bold">•</text>
    <text x="32" y="330" class="body-txt">Structured surrogate PKs &amp; cascading FK rules.</text>

    <rect x="14" y="500" width="332" height="115" class="deliv-card" />
    <text x="24" y="525" class="meta-bold" fill="#FF6A13">VERIFIED DELIVERABLES</text>
    <text x="24" y="552" fill="#FF6A13" font-weight="bold">✔</text><text x="42" y="552" class="deliv-bold">Crow's Foot ERD (SVG / PNG)</text>
    <text x="24" y="578" fill="#FF6A13" font-weight="bold">✔</text><text x="42" y="578" class="deliv-bold">Relational Data Dictionary</text>
    <text x="24" y="604" fill="#FF6A13" font-weight="bold">✔</text><text x="42" y="604" class="deliv-bold">Normalization Audit Report</text>
  </g>

  <!-- CARD 2 -->
  <g transform="translate(430, 205)">
    <rect width="360" height="630" class="card" />
    <path d="M 0 0 L 360 0 L 360 6 L 0 6 Z" fill="#FFB020" />
    <path d="M 1 6 L 359 6 L 359 72 L 1 72 Z" class="card-hdr" />
