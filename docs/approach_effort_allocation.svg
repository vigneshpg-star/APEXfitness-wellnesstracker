    <text x="530" y="68" class="stat-val">5 Triggers</text>
    <text x="530" y="92" class="stat-sub">Zero Redundancy Drift</text>
    <line x1="750" y1="20" x2="750" y2="95" stroke="#26262E" stroke-width="1.5" />

    <!-- Col 4 -->
    <text x="780" y="35" class="section-label">COMPUTED VIEWS</text>
    <text x="780" y="68" class="stat-val">6 Views</text>
    <text x="780" y="92" class="stat-sub">Derived Health Telemetry</text>
    <line x1="1000" y1="20" x2="1000" y2="95" stroke="#26262E" stroke-width="1.5" />

    <!-- Col 5 -->
    <text x="1030" y="35" class="section-label">STRESS BENCHMARK</text>
    <text x="1030" y="68" class="stat-val">5,300+ Logs</text>
    <text x="1030" y="92" class="stat-sub">Sub-70ms Query Latency</text>
    <line x1="1250" y1="20" x2="1250" y2="95" stroke="#26262E" stroke-width="1.5" />

