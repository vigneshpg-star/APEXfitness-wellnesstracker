    <text x="18" y="218" fill="#38BDF8" font-weight="bold">•</text>
    <text x="32" y="218" class="body-txt">Configured pool_pre_ping connection pool.</text>
    <text x="18" y="246" fill="#38BDF8" font-weight="bold">•</text>
    <text x="32" y="246" class="body-txt">Secured environment variables (.env / dotenv).</text>
    <text x="18" y="274" fill="#38BDF8" font-weight="bold">•</text>
    <text x="32" y="274" class="body-txt">Built 5-tab responsive SPA web frontend.</text>
    <text x="18" y="302" fill="#38BDF8" font-weight="bold">•</text>
    <text x="32" y="302" class="body-txt">Integrated 7 Chart.js dynamic visualizers.</text>
    <text x="18" y="330" fill="#38BDF8" font-weight="bold">•</text>
    <text x="32" y="330" class="body-txt">Resolved reciprocal calorie date UNION bugs.</text>

    <rect x="14" y="500" width="332" height="115" class="deliv-card" />
    <text x="24" y="525" class="meta-bold" fill="#38BDF8">VERIFIED DELIVERABLES</text>
    <text x="24" y="552" fill="#38BDF8" font-weight="bold">✔</text><text x="42" y="552" class="deliv-bold">backend/app.py (REST API)</text>
    <text x="24" y="578" fill="#38BDF8" font-weight="bold">✔</text><text x="42" y="578" class="deliv-bold">frontend/index.html (SPA UI)</text>
    <text x="24" y="604" fill="#38BDF8" font-weight="bold">✔</text><text x="42" y="604" class="deliv-bold">Real-Time Burn Estimator</text>
  </g>

