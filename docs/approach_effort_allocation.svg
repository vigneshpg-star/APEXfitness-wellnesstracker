    <text x="18" y="190" fill="#FFB020" font-weight="bold">•</text>
    <text x="32" y="190" class="body-txt">Implemented MySQL 8.0 DDL on InnoDB.</text>
    <text x="18" y="218" fill="#FFB020" font-weight="bold">•</text>
    <text x="32" y="218" class="body-txt">Built BEFORE triggers (trg_nl_total) on meals.</text>
    <text x="18" y="246" fill="#FFB020" font-weight="bold">•</text>
    <text x="32" y="246" class="body-txt">Engineered AFTER triggers for workout burns.</text>
    <text x="18" y="274" fill="#FFB020" font-weight="bold">•</text>
