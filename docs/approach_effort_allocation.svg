<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1020" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0B0B0E; }
      .card { fill: #15151A; stroke: #26262E; stroke-width: 1.5; rx: 10; }
      .card-hdr { fill: #1C1C22; rx: 8; }
      .subcard { fill: #111116; stroke: #22222A; stroke-width: 1; rx: 6; }
      .deliv-card { fill: #181820; stroke: #2B2B38; stroke-width: 1; rx: 6; }
      .title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 28px; font-weight: bold; fill: #FFFFFF; }
      .subtitle { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 15px; fill: #A1A1AA; }
      .section-label { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; font-weight: bold; fill: #71717A; letter-spacing: 0.5px; }
      .step-tag { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; font-weight: bold; }
      .phase-title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 16px; font-weight: bold; fill: #FFFFFF; }
      .meta-bold { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; font-weight: bold; }
      .meta-light { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; fill: #A1A1AA; }
      .body-txt { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12.5px; fill: #E4E4E7; }
      .deliv-bold { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; font-weight: bold; fill: #FFFFFF; }
      .stat-val { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 26px; font-weight: bold; fill: #FFFFFF; }
      .stat-sub { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; fill: #A1A1AA; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1020" class="bg" />

  <!-- Header Banner -->
  <g transform="translate(50, 40)">
    <rect width="48" height="48" rx="10" fill="#1E1E24" stroke="#2E2E38" stroke-width="1.5" />
    <path d="M 24 12 L 36 36 L 12 36 Z" fill="#FF6A13" />
    <text x="65" y="26" class="title">APEX FITNESS &amp; WELLNESS TRACKING SYSTEM</text>
    <text x="65" y="46" class="subtitle">Step-by-Step Approach &amp; Effort Allocation | 4-Step Milestone-Driven Methodology</text>
  </g>

  <!-- Total Effort Pill Badge -->
  <g transform="translate(1290, 45)">
    <rect width="260" height="42" rx="8" fill="#201612" stroke="#FF6A13" stroke-width="1.5" />
    <text x="130" y="26" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#FF6A13" text-anchor="middle">TOTAL EFFORT: 120 HOURS</text>
  </g>

  <!-- Master Progress Allocation Bar -->
  <text x="50" y="118" class="section-label">OVERALL EFFORT ALLOCATION BREAKDOWN</text>
  <g transform="translate(50, 128)">
    <!-- Phase 1: 312px (20.8%) -->
    <rect x="0" y="0" width="310" height="44" rx="4" fill="#FF6A13" />
    <text x="15" y="27" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#0B0B0E">Phase 1: Domain &amp; 3NF (25h / 20.8%)</text>

    <!-- Phase 2: 437px (29.2%) -->
    <rect x="313" y="0" width="435" height="44" rx="4" fill="#FFB020" />
    <text x="328" y="27" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#0B0B0E">Phase 2: DB &amp; ACID Engine (35h / 29.2%)</text>

    <!-- Phase 3: 437px (29.2%) -->
    <rect x="751" y="0" width="435" height="44" rx="4" fill="#38BDF8" />
    <text x="766" y="27" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#0B0B0E">Phase 3: REST API &amp; UI (35h / 29.2%)</text>

    <!-- Phase 4: 314px (20.8%) -->
    <rect x="1189" y="0" width="311" height="44" rx="4" fill="#10B981" />
    <text x="1204" y="27" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#0B0B0E">Phase 4: Stress &amp; Docs (25h / 20.8%)</text>
  </g>

