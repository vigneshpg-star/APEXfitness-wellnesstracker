    <text x="26" y="128" class="meta-light">Schedule: Week 4</text>
    <text x="200" y="128" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#10B981">Testing &amp; Formal Docs</text>

    <text x="18" y="165" class="section-label">KEY ACTIVITIES &amp; METHODOLOGY</text>
    <text x="18" y="190" fill="#10B981" font-weight="bold">•</text>
    <text x="32" y="190" class="body-txt">Simulated 5,000 synthetic records under load.</text>
    <text x="18" y="218" fill="#10B981" font-weight="bold">•</text>
    <text x="32" y="218" class="body-txt">Profiled joins via EXPLAIN ANALYZE trees.</text>
    <text x="18" y="246" fill="#10B981" font-weight="bold">•</text>
    <text x="32" y="246" class="body-txt">Added covering indexes (24.7% faster queries).</text>
    <text x="18" y="274" fill="#10B981" font-weight="bold">•</text>
    <text x="32" y="274" class="body-txt">Compiled formal 17-section PDF/DOCX reports.</text>
    <text x="18" y="302" fill="#10B981" font-weight="bold">•</text>
    <text x="32" y="302" class="body-txt">Exported sample Excel data &amp; 8 CSV sheets.</text>
    <text x="18" y="330" fill="#10B981" font-weight="bold">•</text>
    <text x="32" y="330" class="body-txt">Pushed version-controlled code to GitHub.</text>

    <rect x="14" y="500" width="332" height="115" class="deliv-card" />
    <text x="24" y="525" class="meta-bold" fill="#10B981">VERIFIED DELIVERABLES</text>
    <text x="24" y="552" fill="#10B981" font-weight="bold">✔</text><text x="42" y="552" class="deliv-bold">docs/stress_test_results.md</text>
    <text x="24" y="578" fill="#10B981" font-weight="bold">✔</text><text x="42" y="578" class="deliv-bold">APEX_Industry_Project_Report.pdf</text>
    <text x="24" y="604" fill="#10B981" font-weight="bold">✔</text><text x="42" y="604" class="deliv-bold">sample_data_sheet.xlsx</text>
